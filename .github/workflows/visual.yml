name: Visual Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  visual:
    name: Property combinations (24 screenshots)
    timeout-minutes: 20
    runs-on: ubuntu-latest

    # Declared at JOB level on purpose. A step's `if:` cannot read that step's
    # own `env:` block, so `if: env.ARGOS_TOKEN != ''` next to a step-level env
    # is always false and the upload silently never runs. Job-level env is
    # visible to every step's `if`.
    env:
      ARGOS_TOKEN: ${{ secrets.ARGOS_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # 24 independent tests - one per Importance x Label x Completeness
      # combination - each screenshotting the app after its task is added.
      # Screenshots land in screenshots/visual/.
      - name: Run visual tests
        run: npm run test:visual

      - name: Check screenshots were produced
        if: ${{ !cancelled() }}
        run: |
          count=$(find screenshots -name '*.png' 2>/dev/null | wc -l)
          echo "found $count screenshots"
          echo "### Screenshots" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Captured **$count / 24** combination screenshots." >> "$GITHUB_STEP_SUMMARY"
          if [ "$count" -ne 24 ]; then
            echo "::error::expected 24 screenshots, found $count"
            exit 1
          fi

      # Argos diffs this run against the approved baseline and reports on the PR.
      # Skipped when the secret is absent so forks and clones still run the
      # screenshots instead of failing.
      - name: Upload screenshots to Argos
        if: ${{ env.ARGOS_TOKEN != '' }}
        run: npx @argos-ci/cli upload ./screenshots

      - name: Note when Argos is not configured
        if: ${{ env.ARGOS_TOKEN == '' }}
        run: echo "::notice::ARGOS_TOKEN not set - screenshots captured and uploaded as an artifact, but not diffed by Argos."

      - name: Write summary
        if: ${{ !cancelled() }}
        run: node scripts/report-summary.mjs "Visual combinations" pass

      # Runs on success AND failure - a failed visual run is exactly when the
      # screenshots and report are most worth having.
      - name: Upload screenshots and report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-report
          path: |
            screenshots/
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: warn
