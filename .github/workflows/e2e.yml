name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    name: User stories (must pass)
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        run: npm run test:e2e

      # Everything below runs on success AND failure. `!cancelled()` rather than
      # `always()` so a cancelled run does not upload a half-written report.
      - name: Write summary
        if: ${{ !cancelled() }}
        run: node scripts/report-summary.mjs "User stories (e2e)" pass

      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: warn

  regression-guard:
    name: Regression guard (bugs must still fail)
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # The regression tests are SUPPOSED to fail - they encode three unfixed
      # bugs. This inverts the usual contract: it succeeds only while all of
      # them are still red, and fails if one passes, is skipped, renamed or
      # deleted.
      #
      # A red job means either the bug was genuinely fixed (update
      # scripts/assert-regressions-fail.mjs) or a test was healed into passing.
      # Both need a human to look.
      - name: Assert regression tests still fail
        run: npm run test:guard

      - name: Write summary
        if: ${{ !cancelled() }}
        run: node scripts/report-summary.mjs "Regression tests (must fail)" fail

      - name: Upload regression report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: regression-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: warn
